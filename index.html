<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de estudiantes</title>

    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="app">
      <h1>Gestor de estudiantes</h1>
      <p>Bienvenido al sistema de gestión de estudiantes.</p>

      <form @submit.prevent="agregarEstudiante">
        <fieldset>
          <div>
            <label>Nombre del estudiante:</label>
            <input
              v-model.trim="Nombre"
              type="text"
              placeholder="Nombre completo"
            />
          </div>

          <div>
            <label>Edad:</label>
            <input
              v-model="Edad"
              type="number"
              placeholder="Edad del estudiante"
            />
          </div>

          <div>
            <label>Curso:</label>
            <input
              v-model="curso"
              type="text"
              placeholder="Curso del estudiante"
            />
          </div>

          <div>
            <label>Nota:</label>
            <input
              v-model.number="Nota"
              type="number"
              placeholder="Nota del estudiante"
            />
          </div>

          <br />
          <button type="submit">Registrar estudiante</button>
        </fieldset>
      </form>

      <h2>Lista de estudiantes</h2>

      <div class="filtros">
        <div>
          <label for="filtroCarrera">Filtrar por carrera:</label>
          <select id="filtroCarrera" v-model="filtroCarrera">
            <option value="Todas">Todas</option>
            <option
              v-for="carrera in [...new Set(estudiantes.map(est => est.carrera))]"
              :key="carrera"
              :value="carrera"
            >
              {{ carrera }}
            </option>
          </select>
        </div>

        <div>
          <label for="busqueda">Buscar por nombre:</label>
          <input
            id="busqueda"
            v-model="busqueda"
            type="text"
            placeholder="Escribe un nombre..."
          />
        </div>

        <div class="filtros-estado">
          <button
            type="button"
            @click="filtroEstado = 'Todos'"
            :class="{ activo: filtroEstado === 'Todos' }">
            Todos
          </button>

          <button
            type="button"
            @click="filtroEstado = 'Aprobados'"
            :class="{ activo: filtroEstado === 'Aprobados' }">
            Aprobados
          </button>

          <button
            type="button"
            @click="filtroEstado = 'Reprobados'"
            :class="{ activo: filtroEstado === 'Reprobados' }">
            Reprobados
          </button>
        </div>
      </div>

      <p v-if="estudiantes.length === 0">No hay estudiantes registrados.</p>

      <ul>
        <li v-for="est in estudiantesFiltrados()" :key="est.id">
          {{ est.nombre }} - {{ est.carrera }} -

          <span v-if="est.calificacion === 10">⭐</span>

          <span :class="colorNota(est.calificacion)">
            {{ est.calificacion }}
          </span>

          <button
            @click="aumentarCalificacion(est)"
            :disabled="est.calificacion === 10"
          >
            +1
          </button>

          <button
            @click="disminuirCalificacion(est)"
            :disabled="est.calificacion === 0"
          >
            -1
          </button>

          <button @click="eliminarEstudiante(est.id)">Eliminar</button>
        </li>
      </ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
