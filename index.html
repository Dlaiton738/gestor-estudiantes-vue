
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de estudiantes</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h1>Gestor de estudiantes</h1>
        <p>Bienvenido al sistema de gestión de estudiantes.</p>
        <form @submit.prevent="agregarEstudiante">
            <fieldset>
                <div>
                    <label>nombre: </label>
                    <input v-model.trim="Nombre" type="text" id="nombre" placeholder="nombre completo">
                    <p v-if="errorNombre()">{{errorNombre()}}</p>
                </div>

                <label for="carrera">Carrera:</label>

                <select id="carrera" v-model="carrera">
                    <option value="">Selecciona una carrera</option>

                    <option v-for="opcion in carreras" :value="opcion">
                        {{ opcion }}
                    </option>
                </select>

                <div>
                    <label>calificacion:</label>
                    <input v-model.number="calificacion" type="number" id="calificacion" placeholder="calificacion">
                </div>


                <div>
                   
                </div><br>

                <button type="submit">Registrar estudiante</button>
            </fieldset>
            
        </form>

        <h2>lista de estudiantes</h2>
        
        <ul>
            <li v-for="estudiante in estudiantes">
                {{estudiante}}
            </li>
        </ul>
        <!-- <label>nombre escrito:{{nombre}}</label> -->
        <!-- <br><br>
        <button @click="comprobarFuncionamiento">
            Probar Vue.js
        </button> -->
    </div>

    <script src="app.js"></script>
</body>
</html>
